services:

  # ── Local dev server (hot-reload) ─────────────────────────────────────────
  dev:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      NODE_ENV: development

  # ── Production build served by nginx ──────────────────────────────────────
  app:
    build:
      context: .
      target: production
    ports:
      - "80:80"
    environment:
      NODE_ENV: production

volumes:
  node_modules:
