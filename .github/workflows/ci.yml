name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: evplug-production-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint & application build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # GitHub-hosted runners cannot reach the protected Strapi instance.
      # Validate the application shell here; the VPS performs the CMS-backed
      # prerender and refuses to deploy incomplete article HTML.
      - name: Build application shell
        run: npm run build:ci

      - name: Upload application-shell artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-application-shell
          path: dist/
          retention-days: 7

  deploy:
    name: Prerender blogs and deploy on VPS
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Build verified HTML and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 30m
          script: |
            set -eu
            cd /home/brahim/evclone
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            test -f .env.local || {
              echo "Missing /home/brahim/evclone/.env.local; cannot prerender Strapi articles."
              exit 1
            }

            docker compose --env-file .env.local build --pull app
            docker compose --env-file .env.local up -d --no-build app
            docker compose --env-file .env.local ps app
